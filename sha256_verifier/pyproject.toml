[project]
name = "sha-verifier"
version = "0.1.0"
description = "Verifier for quantum circuits that compute SHA-2/SHA-3 hash functions, built on Google's Kickmix simulator."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "kickmix==1.0.0",
    "numpy>=1.26",
]

[project.scripts]
sha-verify = "sha_verifier.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sha_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# If a test stalls, print every thread's stack after this many seconds.
faulthandler_timeout = 180
