<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" width="680" height="322" role="img">
<title>The merkle root of a usual block and of a coinbase-only block</title>
<desc>Left: in a usual block the transactions are hashed in pairs, level by level, down to one 32-byte merkle root that goes in the header. Right: in a block whose only transaction is the coinbase, the merkle root is the double SHA-256 of the coinbase, so there is no tree.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#444441}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px}
.tl{font-size:12px;fill:#5f5e5a}
.search rect{fill:#e1f5ee;stroke:#0f6e56}.search text{fill:#04342c}
.quantum rect{fill:#eeedfe;stroke:#534ab7}.quantum text{fill:#26215c}
.classical rect{fill:#f1efe8;stroke:#5f5e5a}.classical text{fill:#2c2c2a}
.constant rect{fill:#ffffff;stroke:#888780;stroke-dasharray:4 3}.constant text{fill:#444441}
.result rect{fill:#faeeda;stroke:#854f0b}.result text{fill:#412402}
rect{stroke-width:1}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:1;fill:none}
.rule{stroke:#d3d1c7;stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="321" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text class="th" x="190" y="26" text-anchor="middle" dominant-baseline="central">A usual block</text>
<g class="quantum"><rect x="110" y="46" width="160" height="50" rx="8"/><text class="th" x="190.0" y="62.0" text-anchor="middle" dominant-baseline="central">Merkle root</text><text class="ts" x="190.0" y="80.0" text-anchor="middle" dominant-baseline="central">32 bytes, in the header</text></g>
<g class="quantum"><rect x="30" y="146" width="150" height="50" rx="8"/><text class="th" x="105.0" y="162.0" text-anchor="middle" dominant-baseline="central">Hash of 0 and 1</text><text class="ts" x="105.0" y="180.0" text-anchor="middle" dominant-baseline="central">double SHA-256</text></g>
<g class="quantum"><rect x="200" y="146" width="150" height="50" rx="8"/><text class="th" x="275.0" y="162.0" text-anchor="middle" dominant-baseline="central">Hash of 2 and 3</text><text class="ts" x="275.0" y="180.0" text-anchor="middle" dominant-baseline="central">double SHA-256</text></g>
<g class="search"><rect x="22" y="246" width="78" height="44" rx="8"/><text class="ts" x="61.0" y="268.0" text-anchor="middle" dominant-baseline="central">Coinbase</text></g>
<g class="classical"><rect x="106" y="246" width="78" height="44" rx="8"/><text class="ts" x="145.0" y="268.0" text-anchor="middle" dominant-baseline="central">Tx 1</text></g>
<g class="classical"><rect x="190" y="246" width="78" height="44" rx="8"/><text class="ts" x="229.0" y="268.0" text-anchor="middle" dominant-baseline="central">Tx 2</text></g>
<g class="classical"><rect x="274" y="246" width="78" height="44" rx="8"/><text class="ts" x="313.0" y="268.0" text-anchor="middle" dominant-baseline="central">Tx 3</text></g>
<path d="M61 246 L92 202" class="arr" marker-end="url(#arrow)"/>
<path d="M145 246 L118 202" class="arr" marker-end="url(#arrow)"/>
<path d="M229 246 L262 202" class="arr" marker-end="url(#arrow)"/>
<path d="M313 246 L288 202" class="arr" marker-end="url(#arrow)"/>
<path d="M105 146 L160 102" class="arr" marker-end="url(#arrow)"/>
<path d="M275 146 L220 102" class="arr" marker-end="url(#arrow)"/>
<line x1="378" y1="20" x2="378" y2="302" class="rule"/>
<text class="th" x="530" y="26" text-anchor="middle" dominant-baseline="central">A coinbase-only block: this problem</text>
<g class="quantum"><rect x="430" y="46" width="200" height="50" rx="8"/><text class="th" x="530.0" y="62.0" text-anchor="middle" dominant-baseline="central">Merkle root</text><text class="ts" x="530.0" y="80.0" text-anchor="middle" dominant-baseline="central">= the coinbase's id</text></g>
<g class="search"><rect x="430" y="240" width="200" height="50" rx="8"/><text class="th" x="530.0" y="256.0" text-anchor="middle" dominant-baseline="central">Coinbase</text><text class="ts" x="530.0" y="274.0" text-anchor="middle" dominant-baseline="central">holds the extranonce</text></g>
<path d="M530 240 L530 102" class="arr" marker-end="url(#arrow)"/>
<text class="tl" x="540" y="162" text-anchor="start" dominant-baseline="central">double SHA-256,</text>
<text class="tl" x="540" y="180" text-anchor="start" dominant-baseline="central">no tree</text>
</svg>
