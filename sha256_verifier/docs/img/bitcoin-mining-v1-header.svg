<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>The 80-byte block header across two SHA-256 blocks, drawn to scale</title>
<desc>The first 64-byte SHA-256 block holds the version, the previous block hash and the first 28 bytes of the merkle root. The second holds the last 4 bytes of the merkle root, the time, bits and the nonce, then 48 bytes of constant padding. The nonce is part of the search register, the merkle root is computed from the search register, and the other fields are classical inputs.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#444441}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px}
.tl{font-size:12px;fill:#5f5e5a}
.search rect{fill:#e1f5ee;stroke:#0f6e56}.search text{fill:#04342c}
.quantum rect{fill:#eeedfe;stroke:#534ab7}.quantum text{fill:#26215c}
.classical rect{fill:#f1efe8;stroke:#5f5e5a}.classical text{fill:#2c2c2a}
.constant rect{fill:#ffffff;stroke:#888780;stroke-dasharray:4 3}.constant text{fill:#444441}
.result rect{fill:#faeeda;stroke:#854f0b}.result text{fill:#412402}
rect{stroke-width:1}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:1;fill:none}
.rule{stroke:#d3d1c7;stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="419" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<text class="tl" x="40" y="28" text-anchor="start" dominant-baseline="central">Header, first block: bytes 0 to 63</text>
<g class="classical"><rect x="40" y="40" width="37.5" height="56" rx="4"/></g>
<g class="classical"><rect x="77.5" y="40" width="300" height="56" rx="4"/><text class="th" x="227.5" y="59.0" text-anchor="middle" dominant-baseline="central">prev_hash</text><text class="ts" x="227.5" y="77.0" text-anchor="middle" dominant-baseline="central">32 bytes</text></g>
<g class="quantum"><rect x="377.5" y="40" width="262.5" height="56" rx="4"/><text class="th" x="508.75" y="59.0" text-anchor="middle" dominant-baseline="central">Merkle root</text><text class="ts" x="508.75" y="77.0" text-anchor="middle" dominant-baseline="central">first 28 of its 32 bytes</text></g>
<line x1="59" y1="96" x2="59" y2="116" class="leader"/>
<text class="tl" x="67" y="120" text-anchor="start" dominant-baseline="central">version, 4 bytes</text>
<text class="tl" x="40" y="164" text-anchor="start" dominant-baseline="central">Header, second block: bytes 64 to 79, then padding</text>
<g class="quantum"><rect x="40" y="176" width="37.5" height="56" rx="4"/></g>
<g class="classical"><rect x="77.5" y="176" width="37.5" height="56" rx="4"/></g>
<g class="classical"><rect x="115" y="176" width="37.5" height="56" rx="4"/></g>
<g class="search"><rect x="152.5" y="176" width="37.5" height="56" rx="4"/></g>
<g class="constant"><rect x="190" y="176" width="450" height="56" rx="4"/><text class="th" x="415.0" y="195.0" text-anchor="middle" dominant-baseline="central">pad640</text><text class="ts" x="415.0" y="213.0" text-anchor="middle" dominant-baseline="central">48 bytes of SHA-256 padding, not part of the header</text></g>
<line x1="171" y1="232" x2="171" y2="250" class="leader"/>
<text class="tl" x="179" y="254" text-anchor="start" dominant-baseline="central">nonce, 4 bytes</text>
<line x1="134" y1="232" x2="134" y2="272" class="leader"/>
<text class="tl" x="142" y="276" text-anchor="start" dominant-baseline="central">bits, 4 bytes: the target</text>
<line x1="96" y1="232" x2="96" y2="294" class="leader"/>
<text class="tl" x="104" y="298" text-anchor="start" dominant-baseline="central">time, 4 bytes</text>
<line x1="59" y1="232" x2="59" y2="316" class="leader"/>
<text class="tl" x="67" y="320" text-anchor="start" dominant-baseline="central">Merkle root, last 4 bytes</text>
<g class="search"><rect x="360" y="262" width="14" height="14" rx="2"/></g>
<text class="tl" x="382" y="269" text-anchor="start" dominant-baseline="central">Search register (qubits)</text>
<g class="quantum"><rect x="360" y="284" width="14" height="14" rx="2"/></g>
<text class="tl" x="382" y="291" text-anchor="start" dominant-baseline="central">Computed from the search register</text>
<g class="classical"><rect x="360" y="306" width="14" height="14" rx="2"/></g>
<text class="tl" x="382" y="313" text-anchor="start" dominant-baseline="central">Classical input</text>
<g class="constant"><rect x="360" y="328" width="14" height="14" rx="2"/></g>
<text class="tl" x="382" y="335" text-anchor="start" dominant-baseline="central">Constant</text>
<line x1="40" y1="352" x2="640" y2="352" class="rule"/>
<text class="tl" x="40" y="376" text-anchor="start" dominant-baseline="central">Drawn to scale: each row is one 64-byte SHA-256 block.</text>
<text class="tl" x="40" y="396" text-anchor="start" dominant-baseline="central">The other 6 bytes of the search register are in the coinbase, which the merkle root is the hash of.</text>
</svg>
