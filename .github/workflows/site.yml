name: site

# On every change to main that could alter the site: verify any submission that has no
# receipt yet, commit the receipts, then build and deploy the site.
on:
  push:
    branches: [main]
    paths: ['submissions/**', 'results/**', 'sha_front/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions: {}

# One at a time, in order: each run may push receipts to main.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  # Verifies new submissions. Read-only: this job parses submitted circuit files, so it
  # gets no permission to write. It never runs code from a submission.
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
        working-directory: sha256_verifier
      - name: Verify submissions that have no up-to-date receipt
        working-directory: sha256_verifier
        run: uv run sha-verify record ../submissions ../results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: results
          retention-days: 7

  # Commits the receipts the previous job produced. It takes only JSON files under results/.
  publish:
    needs: record
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results
          path: ${{ runner.temp }}/results
      - name: Commit new receipts
        id: commit
        env:
          NEW: ${{ runner.temp }}/results
        run: |
          # Copy JSON files only, and only ones that parse.
          (cd "$NEW" && find . -type f -name '*.json' -print0) | while IFS= read -r -d '' file; do
            jq -e . "$NEW/$file" > /dev/null
            mkdir -p "results/$(dirname "$file")"
            cp "$NEW/$file" "results/$file"
          done
          git add results
          if git diff --cached --quiet; then
            echo "No new receipts."
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --quiet -m 'Record verification receipts'
            git push --quiet
            git show --stat --format='%h %s' HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sha_front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sha_front/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: sha_front/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
