name: submission

# Verifies a pull request that adds a circuit under submissions/, and comments the result.
#
# This runs on pull_request_target so that it can comment on pull requests from forks. That
# trigger runs with the base repository's workflow and token, so the rule here is strict:
# nothing from the pull request is ever checked out or executed. The base branch supplies
# the workflow and the verifier; the pull request supplies only a circuit file and a
# meta.json, which are read out of git as data and parsed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['submissions/**']

permissions: {}

concurrency:
  group: submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The base branch, not the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
        working-directory: sha256_verifier

      - name: List the files the pull request changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | {filename, status}' | jq -s . > "$RUNNER_TEMP/changed.json"

      - name: Find the submission directory
        id: find
        working-directory: sha256_verifier
        run: |
          set +e
          name=$(uv run sha-verify pr-check "$RUNNER_TEMP/changed.json" --comment "$RUNNER_TEMP/out/comment.md")
          code=$?
          set -e
          # pr-check only prints a name it has validated: lower-case letters, digits, hyphens.
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Read the circuit and meta.json out of the pull request
        if: steps.find.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.find.outputs.name }}
        run: |
          # Fetched as git objects and written out as plain files. No checkout, no hooks.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --quiet --no-tags origin "+refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          dest="$RUNNER_TEMP/submission/$NAME"
          mkdir -p "$dest"
          for file in circuit.kmb.zst circuit.kmx.zst circuit.kmb circuit.kmx meta.json; do
            blob="$HEAD_SHA:submissions/$NAME/$file"
            if git cat-file -e "$blob" 2>/dev/null; then
              if [ "$(git cat-file -s "$blob")" -gt 536870912 ]; then
                echo "$file is larger than 512 MiB."
                exit 1
              fi
              git cat-file blob "$blob" > "$dest/$file"
            fi
          done
          ls -l "$dest"

      - name: Verify the circuit
        id: verify
        if: steps.find.outputs.code == '0'
        working-directory: sha256_verifier
        env:
          NAME: ${{ steps.find.outputs.name }}
          # The account that opened the pull request: the only one meta.json may name.
          OPENER_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set +e
          uv run sha-verify pr-verify "$RUNNER_TEMP/submission/$NAME" \
            --receipt "$RUNNER_TEMP/out/receipt.json" --comment "$RUNNER_TEMP/out/comment.md" --index ../results/index.json \
            --github-user-id "$OPENER_ID"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize
        id: result
        env:
          FIND: ${{ steps.find.outputs.code }}
          VERIFY: ${{ steps.verify.outputs.code }}
        run: |
          if [ "$FIND" = "3" ]; then outcome=skipped
          elif [ "$FIND" = "0" ] && [ "$VERIFY" = "0" ]; then outcome=pass
          elif [ -f "$RUNNER_TEMP/out/comment.md" ]; then outcome=fail
          else outcome=error
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "Outcome: $outcome"
          if [ -f "$RUNNER_TEMP/out/comment.md" ]; then cat "$RUNNER_TEMP/out/comment.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.result.outputs.outcome == 'pass' || steps.result.outputs.outcome == 'fail'
        with:
          name: verification
          path: ${{ runner.temp }}/out
          retention-days: 30

      - name: Fail unless the submission passed
        if: steps.result.outputs.outcome == 'fail' || steps.result.outputs.outcome == 'error'
        run: exit 1

  # A separate job holds the permission to comment, so the job that parses the submitted
  # file never has a token that can write anything.
  comment:
    needs: verify
    if: always() && (needs.verify.outputs.outcome == 'pass' || needs.verify.outputs.outcome == 'fail')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification
          path: out
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          head -c 60000 out/comment.md > body.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- sha256.fail verification -->")) | .id' | tail -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
