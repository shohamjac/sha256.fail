name: frontend
on:
  push:
    branches: [main]
    paths: ['sha_front/**', 'results/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['sha_front/**', 'results/**', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sha_front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sha_front/package-lock.json
      - run: npm ci
      # The tests read ../results/index.json, so they also check the site against real data.
      - run: npm test
      - run: npm run build
