name: verifier
on:
  push:
    branches: [main]
    paths: ['sha256_verifier/**', 'submissions/**', 'results/**', '.github/workflows/verifier.yml']
  pull_request:
    paths: ['sha256_verifier/**', 'submissions/**', 'results/**', '.github/workflows/verifier.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sha256_verifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # --locked fails if uv.lock is out of date; the lock pins the hash of every wheel.
      - run: uv sync --locked
      - run: uv run sha-verify selftest
      - run: uv run pytest -q
      # Every committed receipt must reproduce exactly on this machine.
      - name: Replay the committed receipts
        run: |
          for receipt in ../results/*/*.json; do
            dir=$(jq -er .submission.path "$receipt")
            uv run sha-verify replay "$receipt" "../$dir"
          done
      # And the baseline must pass again on random tests nobody has seen.
      - name: Verify the baseline with a fresh salt
        run: uv run sha-verify run ../submissions/example/circuit.kmb.zst --random-salt > /dev/null
