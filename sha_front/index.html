<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A public benchmark for quantum circuits built on SHA-256, from one compression to a Bitcoin mining oracle, with every entry verified on a million random inputs." />
    <meta name="color-scheme" content="light dark" />
    <title>sha256.fail</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Sets the theme before the first paint, so a dark page never flashes light. A choice
      // made with the header toggle is remembered; until then the system setting is followed.
      (function () {
        var root = document.documentElement;
        var system = window.matchMedia('(prefers-color-scheme: dark)');
        function stored() {
          try { return localStorage.getItem('theme'); } catch (e) { return null; }
        }
        function apply() {
          var choice = stored();
          root.dataset.theme = choice === 'light' || choice === 'dark' ? choice : system.matches ? 'dark' : 'light';
        }
        apply();
        system.addEventListener('change', apply);
      })();
    </script>
    <script>
      // Google Analytics. Every page is a hash route (#/rules, #/submit, ...), and GA drops
      // everything after the #, so the automatic page view is off and each route is sent as a
      // path instead: #/rules becomes /sha256.fail/rules. Local dev servers are not tracked.
      (function () {
        var id = 'G-SCW3D0RQND';
        var host = location.hostname;
        if (host === 'localhost' || host === '127.0.0.1' || host === '') return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', id, { send_page_view: false });
        function sendPage() {
          var page = location.hash.split('?')[0].replace(/^#/, '') || '/';
          gtag('event', 'page_view', {
            page_location: location.origin + location.pathname.replace(/\/(index\.html)?$/, '') + page,
          });
        }
        sendPage();
        window.addEventListener('hashchange', sendPage);
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
